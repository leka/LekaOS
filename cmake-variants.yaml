buildType:
  default: Develop
  choices:
    Develop:
      short: Develop
      long: Emit debug information but also optimize
      buildType: Develop
    Debug:
      short: Debug
      long: Emit debug information and don't optimize
      buildType: Debug
    Release:
      short: Release
      long: Optimize generated code
      buildType: Release

board:
  default: LEKA_V1_PROD
  choices:
    LEKA_V1_PROD:
      short: LEKA_V1_PROD
      settings:
        MBED_TARGET: LEKA_V1_PROD
        UPLOAD_METHOD: NONE
        OS_VERSION: 0.0.0
        ENABLE_LOG_DEBUG: ON

